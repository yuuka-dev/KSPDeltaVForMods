[workspace]
members = ["crates/kopdeltav"]

[package]
name = "kspdeltavformods"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kopdeltav = { path = "crates/kopdeltav" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
